name: PLP Filterdaten

# Spiegelt zuerst die Shopify-Preise ins Webflow-CMS und regeneriert danach
# dist/plp-filterdata.json + search-index.json + Merchant-Feeds.
# Stuendlich + manuell ausloesbar.

on:
  schedule:
    - cron: '0 * * * *'      # stuendlich (UTC)
  workflow_dispatch: {}       # manueller Knopf in GitHub -> Actions

permissions:
  contents: write

concurrency:
  group: plp-filterdata
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Quelle der Wahrheit ist Shopify. Dieser Schritt schreibt product-price,
      # schema-preis und preis-pln je Locale ins CMS. Muss VOR der Feed-
      # Erzeugung laufen, sonst bauen die Feeds auf veralteten CMS-Werten auf.
      - name: Shopify-Preise ins Webflow-CMS spiegeln
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: python tools/sync_prices.py

      - name: Generate Merchant-Center-Feeds
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: python tools/gen_merchant_feed.py dist

      - name: Generate dist/plp-filterdata.json
        env:
          WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
        run: python tools/gen_filtermap.py dist/plp-filterdata.json

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "kessler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Aenderung."
          else
            git commit -m "chore: regenerate feeds + filterdata [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sf "https://purge.jsdelivr.net/gh/SaschaKesslerPro/kessler-pro-scripts@main/dist/plp-filterdata.json" || true
          curl -sf "https://purge.jsdelivr.net/gh/SaschaKesslerPro/kessler-pro-scripts@main/dist/search-index.json" || true
