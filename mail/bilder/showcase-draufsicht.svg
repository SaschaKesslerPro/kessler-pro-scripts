<svg xmlns="http://www.w3.org/2000/svg" width="536" height="450" viewBox="0 0 536 450" font-family="Onest, 'DejaVu Sans', Helvetica, Arial, sans-serif">
  <rect width="536" height="450" fill="#FFFFFF"/>
  <!-- Platte 400 x 400 mm, 0.65 px/mm, Ursprung (120,86). R30 vorne (unten). -->
  <path d="M120,86 H380 V326.5 A19.5,19.5 0 0 1 360.5,346 H139.5 A19.5,19.5 0 0 1 120,326.5 Z" fill="#E9E6E0" stroke="#1E1E1E" stroke-width="3" stroke-linejoin="round"/>
  <!-- Ausschnitt Ø85 bei x200 / y90 -->
  <circle cx="250" cy="144.5" r="27.6" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="1.5"/>
  <line x1="250" y1="108" x2="250" y2="181" stroke="#6D6A63" stroke-width=".75"/>
  <line x1="213.5" y1="144.5" x2="286.5" y2="144.5" stroke="#6D6A63" stroke-width=".75"/>
  <!-- Bohrungen 4 x Ø8, 75 mm von den Kanten -->
  <g fill="#FFFFFF" stroke="#1E1E1E" stroke-width="1.5">
    <circle cx="168.75" cy="134.75" r="3.2"/><circle cx="331.25" cy="134.75" r="3.2"/>
    <circle cx="168.75" cy="297.25" r="3.2"/><circle cx="331.25" cy="297.25" r="3.2"/>
  </g>
  <g stroke="#6D6A63" stroke-width=".75">
    <line x1="162" y1="134.75" x2="175.5" y2="134.75"/><line x1="168.75" y1="128" x2="168.75" y2="141.5"/>
    <line x1="324.5" y1="134.75" x2="338" y2="134.75"/><line x1="331.25" y1="128" x2="331.25" y2="141.5"/>
    <line x1="162" y1="297.25" x2="175.5" y2="297.25"/><line x1="168.75" y1="290.5" x2="168.75" y2="304"/>
    <line x1="324.5" y1="297.25" x2="338" y2="297.25"/><line x1="331.25" y1="290.5" x2="331.25" y2="304"/>
  </g>

  <!-- Masslinie unten -->
  <g stroke="#1E1E1E" stroke-width="1">
    <line x1="120" y1="368" x2="380" y2="368"/>
    <line x1="120" y1="362" x2="120" y2="374"/><line x1="380" y1="362" x2="380" y2="374"/>
  </g>
  <g stroke="#6D6A63" stroke-width=".75"><line x1="120" y1="350" x2="120" y2="362"/><line x1="380" y1="350" x2="380" y2="362"/></g>
  <rect x="198" y="358" width="104" height="20" fill="#FFFFFF"/>
  <text x="250" y="372.5" text-anchor="middle" font-size="13" font-weight="500" fill="#1E1E1E">400 × 400 mm</text>

  <!-- Hinweislinien -->
  <g stroke="#6D6A63" stroke-width="1" fill="none">
    <path d="M96,52 L182,170"/>
    <path d="M232,52 L232,84"/>
    <path d="M372,52 L270,125"/>
    <path d="M70,404 L125.5,340.5"/>
    <path d="M404,297 L336,297"/>
  </g>
  <g fill="#1E1E1E">
    <circle cx="182" cy="170" r="3"/><circle cx="232" cy="85" r="3"/><circle cx="270" cy="125" r="3"/><circle cx="125.5" cy="340.5" r="3"/><circle cx="337" cy="297" r="3"/>
  </g>

  <!-- Beschriftungen -->
  <g fill="#1E1E1E" font-size="14" font-weight="500">
    <text x="16" y="30">Sonoma oak</text>
    <text x="176" y="30">ABS edge 2 mm</text>
    <text x="340" y="30">Cut-out Ø 85</text>
    <text x="16" y="428">R 30</text>
    <text x="404" y="288">4 × Ø 8</text>
  </g>
  <g fill="#6D6A63" font-size="12">
    <text x="16" y="47">furniture board · 25 mm</text>
    <text x="176" y="47">black · all four sides</text>
    <text x="340" y="47">200 from the left · 90 from the back</text>
    <text x="16" y="445">both front corners</text>
    <text x="404" y="305">mounting holes</text>
    <text x="404" y="321">75 mm from the edges</text>
  </g>
</svg>
